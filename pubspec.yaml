name: captrio
description: "Real-time captions and accessibility app for deaf and hard-of-hearing users."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  provider: ^6.1.2
  go_router: ^14.2.7
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  http: ^1.2.2
  http_parser: ^4.1.2
  dio: ^5.7.0
  flutter_contacts: ^2.1.0
  url_launcher: ^6.3.0
  glassmorphism: ^3.0.0
  animate_do: ^3.3.4
  speech_to_text: ^7.3.0
  just_audio: ^0.9.42
  video_player: ^2.9.1
  youtube_player_iframe: ^5.2.2
  record: ^6.2.0
  web_socket_channel: ^3.0.3
  image: ^4.8.0
  telephony: ^0.2.0
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800